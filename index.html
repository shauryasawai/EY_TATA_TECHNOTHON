<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Agent Loan Processing System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #ebf4ff 0%, #e0e7ff 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 1rem;
            border-bottom: 4px solid #4f46e5;
        }

        .header h1 {
            color: #312e81;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .stages {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .stage {
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            background: #e5e7eb;
            color: #4b5563;
        }

        .stage.active-sales { background: #3b82f6; color: white; }
        .stage.active-verification { background: #10b981; color: white; }
        .stage.active-underwriting { background: #f97316; color: white; }
        .stage.active-sanction { background: #ec4899; color: white; }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .message {
            display: flex;
            margin-bottom: 1rem;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 600px;
            padding: 1rem;
            border-radius: 0.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border: 2px solid;
        }

        .message.user .message-content {
            background: #4f46e5;
            color: white;
            border-color: #4338ca;
        }

        .message.bot .message-content {
            background: white;
        }

        .message.bot.master .message-content {
            background: #f3e8ff;
            border-color: #c084fc;
        }

        .message.bot.sales .message-content {
            background: #dbeafe;
            border-color: #93c5fd;
        }

        .message.bot.verification .message-content {
            background: #d1fae5;
            border-color: #6ee7b7;
        }

        .message.bot.underwriting .message-content {
            background: #fed7aa;
            border-color: #fdba74;
        }

        .message.bot.sanction .message-content {
            background: #fce7f3;
            border-color: #f9a8d4;
        }

        .agent-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            opacity: 0.75;
        }

        .message-text {
            font-size: 0.875rem;
            line-height: 1.5;
        }

        .download-btn {
            margin-top: 0.75rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #4f46e5;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.875rem;
        }

        .download-btn:hover {
            background: #4338ca;
        }

        .typing {
            display: flex;
            gap: 0.5rem;
            padding: 1rem;
            background: #e5e7eb;
            border-radius: 0.5rem;
            width: fit-content;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #6b7280;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        .input-area {
            background: white;
            border-top: 2px solid #e0e7ff;
            padding: 1rem;
        }

        .input-container {
            display: flex;
            gap: 0.5rem;
            max-width: 1000px;
            margin: 0 auto;
        }

        .input-field {
            flex: 1;
            border: 2px solid #d1d5db;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            outline: none;
        }

        .input-field:focus {
            border-color: #4f46e5;
        }

        .send-btn {
            background: #4f46e5;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            border: none;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .send-btn:hover:not(:disabled) {
            background: #4338ca;
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .icon {
            width: 16px;
            height: 16px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Multi-Agent Loan Processing System</h1>
        <div class="stages">
            <span class="stage" id="stage-sales">Sales</span>
            <span class="stage" id="stage-verification">Verification</span>
            <span class="stage" id="stage-underwriting">Underwriting</span>
            <span class="stage" id="stage-sanction">Sanction</span>
        </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
        <div class="input-container">
            <input type="text" id="input" class="input-field" placeholder="Type your message..." />
            <button id="send-btn" class="send-btn">
                <span>Send</span>
            </button>
        </div>
    </div>

    <script>
        const state = {
            messages: [],
            currentAgent: 'master',
            stage: 'initial',
            isProcessing: false,
            sessionData: {
                name: '',
                mobile: '',
                email: '',
                amount: '',
                purpose: '',
                tenure: '',
                pan: '',
                aadhaar: '',
                creditScore: null,
                dti: null,
                approval: null
            }
        };

        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function addMessage(sender, agent, text, metadata = {}) {
            const message = { sender, agent, text, metadata };
            state.messages.push(message);
            renderMessage(message);
            scrollToBottom();
        }

        function renderMessage(msg) {
            const div = document.createElement('div');
            div.className = `message ${msg.sender} ${msg.agent || ''}`;
            
            let content = `<div class="message-content">`;
            
            if (msg.sender === 'bot' && msg.agent) {
                content += `<div class="agent-label">
                    <span>${msg.agent} Agent</span>
                </div>`;
            }
            
            content += `<div class="message-text">${msg.text}</div>`;
            
            if (msg.metadata.sanctionLetter) {
                content += `<button class="download-btn" onclick="downloadSanctionLetter(${JSON.stringify(msg.metadata.data).replace(/"/g, '&quot;')})">
                    Download Sanction Letter
                </button>`;
            }
            
            content += `</div>`;
            div.innerHTML = content;
            messagesEl.appendChild(div);
        }

        function showTyping() {
            const div = document.createElement('div');
            div.id = 'typing-indicator';
            div.className = 'message bot';
            div.innerHTML = `<div class="typing">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>`;
            messagesEl.appendChild(div);
            scrollToBottom();
        }

        function hideTyping() {
            const typing = document.getElementById('typing-indicator');
            if (typing) typing.remove();
        }

        function scrollToBottom() {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function updateStage(newStage) {
            state.stage = newStage;
            document.querySelectorAll('.stage').forEach(s => {
                s.className = 'stage';
            });
            if (newStage !== 'initial') {
                document.getElementById(`stage-${newStage}`).className += ` active-${newStage}`;
            }
        }

        async function masterAgent(userMessage) {
            const lowerMsg = userMessage.toLowerCase();
            
            if (lowerMsg.includes('loan') || lowerMsg.includes('need') || state.stage === 'initial') {
                state.currentAgent = 'sales';
                updateStage('sales');
                await sleep(500);
                addMessage('bot', 'sales', 'Great! I\'d be happy to help you with a loan. Let me gather some information.');
                await sleep(800);
                addMessage('bot', 'sales', 'What amount are you looking to borrow?');
            }
        }

        async function salesAgent(userMessage) {
            if (!state.sessionData.amount) {
                const amount = userMessage.replace(/[₹,]/g, '').match(/\d+/)?.[0];
                if (amount) {
                    state.sessionData.amount = amount;
                    await sleep(500);
                    addMessage('bot', 'sales', `Perfect! ₹${parseInt(amount).toLocaleString('en-IN')} noted.`);
                    await sleep(800);
                    addMessage('bot', 'sales', 'What\'s the purpose of this loan? (e.g., Home renovation, Medical, Education, Business)');
                } else {
                    addMessage('bot', 'sales', 'Please enter a valid loan amount (e.g., 500000 or 5 lakhs)');
                }
                return;
            }

            if (!state.sessionData.purpose) {
                state.sessionData.purpose = userMessage;
                await sleep(500);
                addMessage('bot', 'sales', `Got it! Loan for ${userMessage}.`);
                await sleep(800);
                addMessage('bot', 'sales', 'What tenure (in months) would you prefer? (e.g., 12, 24, 36, 60)');
                return;
            }

            if (!state.sessionData.tenure) {
                const tenure = userMessage.match(/\d+/)?.[0];
                if (tenure) {
                    state.sessionData.tenure = tenure;
                    await sleep(500);
                    addMessage('bot', 'sales', `${tenure} months - excellent choice!`);
                    await sleep(800);
                    addMessage('bot', 'sales', 'Now, let me collect your basic details. What\'s your full name?');
                } else {
                    addMessage('bot', 'sales', 'Please enter a valid tenure in months (e.g., 24)');
                }
                return;
            }

            if (!state.sessionData.name) {
                state.sessionData.name = userMessage;
                await sleep(500);
                addMessage('bot', 'sales', `Nice to meet you, ${userMessage}!`);
                await sleep(800);
                addMessage('bot', 'sales', 'What\'s your mobile number?');
                return;
            }

            if (!state.sessionData.mobile) {
                const mobile = userMessage.replace(/\D/g, '');
                if (mobile.length === 10) {
                    state.sessionData.mobile = mobile;
                    await sleep(500);
                    addMessage('bot', 'sales', 'Mobile number saved!');
                    await sleep(800);
                    addMessage('bot', 'sales', 'Finally, what\'s your email address?');
                } else {
                    addMessage('bot', 'sales', 'Please enter a valid 10-digit mobile number');
                }
                return;
            }

            if (!state.sessionData.email) {
                if (userMessage.includes('@') && userMessage.includes('.')) {
                    state.sessionData.email = userMessage;
                    await sleep(500);
                    addMessage('bot', 'sales', 'Perfect! All information collected.');
                    await sleep(1000);
                    addMessage('bot', 'master', '✓ Sales qualification complete. Routing to verification...');
                    state.currentAgent = 'verification';
                    updateStage('verification');
                    await sleep(1200);
                    addMessage('bot', 'verification', 'Now I need to verify your identity.');
                    await sleep(800);
                    addMessage('bot', 'verification', 'Please enter your PAN card number (format: ABCDE1234F):');
                } else {
                    addMessage('bot', 'sales', 'Please enter a valid email address');
                }
            }
        }

        async function verificationAgent(userMessage) {
            if (!state.sessionData.pan) {
                const panPattern = /^[A-Z]{5}[0-9]{4}[A-Z]$/;
                const pan = userMessage.toUpperCase().trim();
                
                if (panPattern.test(pan)) {
                    state.sessionData.pan = pan;
                    await sleep(500);
                    addMessage('bot', 'verification', `✓ PAN card verified: ${pan}`);
                    await sleep(800);
                    addMessage('bot', 'verification', 'Now, please enter your Aadhaar number (12 digits):');
                } else {
                    addMessage('bot', 'verification', 'Invalid PAN format. Please enter a valid PAN (e.g., ABCDE1234F)');
                }
                return;
            }

            if (!state.sessionData.aadhaar) {
                const aadhaar = userMessage.replace(/\D/g, '');
                
                if (aadhaar.length === 12) {
                    const masked = `XXXX-XXXX-${aadhaar.slice(-4)}`;
                    state.sessionData.aadhaar = aadhaar;
                    await sleep(500);
                    addMessage('bot', 'verification', `✓ Aadhaar verified: ${masked}`);
                    await proceedToUnderwriting();
                } else {
                    addMessage('bot', 'verification', 'Invalid Aadhaar number. Please enter a valid 12-digit Aadhaar number');
                }
            }
        }

        async function proceedToUnderwriting() {
            await sleep(1000);
            addMessage('bot', 'master', '✓ KYC verification complete. Routing to underwriting...');
            state.currentAgent = 'underwriting';
            updateStage('underwriting');
            
            await sleep(1500);
            addMessage('bot', 'underwriting', '🔍 Analyzing your credit profile...');
            
            await sleep(2000);
            const creditScore = 720;
            const dti = 35;
            state.sessionData.creditScore = creditScore;
            state.sessionData.dti = dti;
            
            addMessage('bot', 'underwriting', `✓ Credit Score: ${creditScore}`);
            await sleep(800);
            addMessage('bot', 'underwriting', `✓ Debt-to-Income Ratio: ${dti}%`);
            await sleep(800);
            addMessage('bot', 'underwriting', '✓ Risk Assessment: LOW');
            await sleep(1000);
            
            const approvedAmount = parseInt(state.sessionData.amount);
            const interestRate = 11.5;
            
            state.sessionData.approval = { 
                amount: approvedAmount, 
                rate: interestRate,
                status: 'approved'
            };
            
            addMessage('bot', 'underwriting', `🎉 LOAN APPROVED: ₹${approvedAmount.toLocaleString('en-IN')} @ ${interestRate}% for ${state.sessionData.tenure} months`);
            
            await sleep(1200);
            addMessage('bot', 'master', '✓ Underwriting complete. Generating sanction letter...');
            state.currentAgent = 'sanction';
            updateStage('sanction');
            
            await sleep(1500);
            generateSanctionLetter(approvedAmount, interestRate);
        }

        function generateSanctionLetter(amount, rate) {
            addMessage('bot', 'sanction', '📄 Generating your sanction letter...');
            
            setTimeout(() => {
                const emi = Math.round((amount * rate/100/12 * Math.pow(1 + rate/100/12, state.sessionData.tenure)) / (Math.pow(1 + rate/100/12, state.sessionData.tenure) - 1));
                
                const sanctionData = {
                    applicantName: state.sessionData.name,
                    loanAmount: amount,
                    interestRate: rate,
                    tenure: state.sessionData.tenure,
                    emi: emi,
                    sanctionDate: new Date().toLocaleDateString('en-IN')
                };
                
                addMessage('bot', 'sanction', `🎊 Congratulations ${state.sessionData.name}! Your loan has been sanctioned.`, { 
                    sanctionLetter: true,
                    data: sanctionData
                });
                
                setTimeout(() => {
                    addMessage('bot', 'sanction', 'Your sanction letter has been sent to your email. You can also download it using the button above.');
                    setTimeout(() => {
                        addMessage('bot', 'sanction', 'Would you like to proceed with the disbursement? (Type "yes" to continue)');
                    }, 1000);
                }, 800);
            }, 2000);
        }

        function downloadSanctionLetter(data) {
            const letter = `
LOAN SANCTION LETTER
=====================

Date: ${data.sanctionDate}

Dear ${data.applicantName},

We are pleased to inform you that your loan application has been approved.

LOAN DETAILS:
- Loan Amount: ₹${data.loanAmount.toLocaleString('en-IN')}
- Interest Rate: ${data.interestRate}% p.a.
- Tenure: ${state.sessionData.tenure} months
- EMI: ₹${data.emi.toLocaleString('en-IN')}

Please proceed with the disbursement process.

Best Regards,
Loan Processing Team
            `;
            
            const blob = new Blob([letter], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'sanction_letter.txt';
            a.click();
        }

        async function handleSend() {
            if (!inputEl.value.trim() || state.isProcessing) return;

            const userMessage = inputEl.value.trim();
            inputEl.value = '';
            addMessage('user', null, userMessage);
            
            state.isProcessing = true;
            sendBtn.disabled = true;
            showTyping();

            await sleep(500);
            hideTyping();

            try {
                if (state.stage === 'initial') {
                    await masterAgent(userMessage);
                } else if (state.stage === 'sales' || state.currentAgent === 'sales') {
                    await salesAgent(userMessage);
                } else if (state.stage === 'verification' || state.currentAgent === 'verification') {
                    await verificationAgent(userMessage);
                } else if (state.stage === 'sanction') {
                    if (userMessage.toLowerCase().includes('yes')) {
                        addMessage('bot', 'sanction', '✓ Disbursement process initiated! Funds will be transferred within 24 hours.');
                        await sleep(1000);
                        addMessage('bot', 'sanction', 'Thank you for choosing our services. Have a great day! 🎉');
                    } else {
                        addMessage('bot', 'sanction', 'No problem! You can proceed whenever you\'re ready. Just let us know.');
                    }
                }
            } finally {
                state.isProcessing = false;
                sendBtn.disabled = false;
            }
        }

        sendBtn.addEventListener('click', handleSend);
        inputEl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });

        // Initialize
        addMessage('bot', 'master', 'Hello! I\'m your loan assistant. How can I help you today?');
    </script>
</body>
</html>
